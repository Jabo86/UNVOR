name: UNVOR documentation and web checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tools/check_repository.py
      - run: python3 tools/check_web.py
      - run: node --check web/hud.js
      - run: python3 -m py_compile tools/verify_apk.py tools/prepare_release.py tools/apk_signer.py
      - run: python3 -m unittest discover -s tests -v
      - run: node --check nexus/scene.mjs && node --check nexus/app.mjs
      - run: node --test tests/nexus.test.mjs
