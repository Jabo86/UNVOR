name: UNVOR documentation checks
on:
  push:
    paths:
      - "**.md"
      - "assets/**"
      - "releases/**"
      - "tools/check_repository.py"
      - ".github/workflows/documentation.yml"
  pull_request:
    paths:
      - "**.md"
      - "assets/**"
      - "releases/**"
      - "tools/check_repository.py"
      - ".github/workflows/documentation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/check_repository.py
